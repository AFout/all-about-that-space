<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Checklist</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f7fa;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: #1697C9;
}

label {
    display: block;
    margin: 15px 0;
    font-size: 18px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 15px;
    cursor: pointer;
}

.complete-btn {
    background: #1697C9;
    color: white;
    font-weight: bold;
}

.complete-btn:hover {
    background: #117ea9;
}

.notes-title {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

</style>

</head>
<body>

<div class="container">

<h1>🍳 Kitchen Checklist</h1>

<label><input type="checkbox"> Washed Windows (glass, frame, sill, and sashes)</label>

<label><input type="checkbox"> Washed Walls and Baseboards</label>

<label><input type="checkbox"> Cleaned and Sanitized Sink and Countertops</label>

<label><input type="checkbox"> Cleaned Interior and Exterior of Cabinets</label>

<label><input type="checkbox"> Cleaned Cabinet Facings</label>

<label><input type="checkbox"> Cleaned Interior and Exterior of Stove</label>

<label><input type="checkbox"> Swept and Mopped Behind The Stove</label>

<label><input type="checkbox"> Cleaned Interior and Exterior of Refrigerator</label>

<label><input type="checkbox"> Swept and Mopped Behind Refrigerator</label>

<label><input type="checkbox"> Cleaned and Dusted Ceiling Fan</label>

<label><input type="checkbox"> Swept and Mopped Floors</label>

<label><input type="checkbox"> Vacuumed and Scrubbed Carpets</label>


<div class="notes-title">
📝 Notes
</div>

<textarea id="kitchenNotes"
placeholder="Enter notes, damages, maintenance issues, or other observations here..."></textarea>

<button class="complete-btn" onclick="returnHome()">
✅ Complete Kitchen & Return Home
</button>

</div>

<script>

function saveChecklist() {

    const checks = document.querySelectorAll(
        "input[type='checkbox']"
    );

    let report = "KITCHEN\n\n";

    checks.forEach((box) => {

        if (box.checked) {

            report +=
               box.parentElement.innerText +
                ". ";

        }

    });

    const notes =
        document.getElementById(
            "kitchenNotes"
        ).value;

    if (notes.trim() !== "") {

        report +=
            "\n\nNotes: " +
            notes;

    }

    report +=
        "\n----------------------------\n";

    localStorage.setItem(
        "KitchenReport",
        report
    );

    localStorage.setItem(
        "KitchenComplete",
        "true"
    );

}

function returnHome() {

    saveChecklist();

    location.href = "index.html";

}

</script>

</body>
</html>
