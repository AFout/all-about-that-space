<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallway Checklist</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f7fa;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: #1697C9;
}

label {
    display: block;
    margin: 15px 0;
    font-size: 18px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 15px;
    cursor: pointer;
}

.complete-btn {
    background: #1697C9;
    color: white;
    font-weight: bold;
}

.complete-btn:hover {
    background: #117ea9;
}

.notes-title {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

</style>

</head>
<body>

<div class="container">

<h1>🚪 Hallway Checklist</h1>

<label><input type="checkbox"> Washed Windows (glass, frame, sill, and sashes)</label>

<label><input type="checkbox"> Washed Walls and Baseboards</label>

<label><input type ="checkbox"> Cleaned interior and exterior of cabinet</label>

<label><input type ="checkbox"> Cleaned cabinet facings</label>

<label><input type ="checkbox"> Cleaned and Dusted Air Vent</label>

<label><input type="checkbox"> Cleaned and Dusted Ceiling Fan</label>

<label><input type="checkbox"> Swept and Mopped Floors</label>

<label><input type="checkbox"> Vacuumed and Scrubbed Carpets</label>


<div class="notes-title">
📝 Notes
</div>

<textarea id="hallwayNotes"
placeholder="Enter notes, damages, maintenance issues, or other observations here..."></textarea>

<button class="complete-btn" onclick="returnHome()">
✅ Complete Hallway & Return Home
</button>

</div>

<script>

function saveChecklist() {

    const checks = document.querySelectorAll(
        "input[type='checkbox']"
    );

    let report = "HALLWAY\n\n";

    checks.forEach((box) => {

        if (box.checked) {

            report +=
                box.parentElement.innerText +
                ". ";

        }

    });

    const notes =
        document.getElementById(
            "hallwayNotes"
        ).value;

    if (notes.trim() !== "") {

        report +=
            "\n\nNotes: " +
            notes;

    }

    report +=
        "\n----------------------------\n";

    const checkboxStates = [];

    checks.forEach((box) => {

        checkboxStates.push(
            box.checked
        );

    });

    localStorage.setItem(
        "HallwayChecks",
        JSON.stringify(
            checkboxStates
        )
    );

    localStorage.setItem(
        "HallwayReport",
        report
    );

    localStorage.setItem(
        "HallwayNotes",
        notes
    );

    localStorage.setItem(
        "HallwayComplete",
        "true"
    );

}

function returnHome() {

    saveChecklist();

    location.href = "index.html";

}

window.onload = function() {

    const savedChecks =
        JSON.parse(
            localStorage.getItem(
                "HallwayChecks"
            )
        );

    if (savedChecks) {

        const checkboxes =
            document.querySelectorAll(
                "input[type='checkbox']"
            );

        checkboxes.forEach(
            (box, index) => {

                box.checked =
                    savedChecks[index];

            }
        );

    }

    const savedNotes =
        localStorage.getItem(
            "HallwayNotes"
        );

    if (savedNotes) {

        document.getElementById(
            "hallwayNotes"
        ).value =
            savedNotes;

    }

};

</script>
</body>
</html>
